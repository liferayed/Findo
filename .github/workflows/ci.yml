name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (api)
        run: npm test --workspace=api
      - name: Type-check + build web
        run: npm run build --workspace=web

  smoke:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: findo
          POSTGRES_PASSWORD: findo
          POSTGRES_DB: findo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://findo:findo@localhost:5432/findo
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run migrations
        run: npm run migrate --workspace=api -- up

      - name: Seed dev user
        run: npm run seed --workspace=api

      - name: Integration tests (api, against live Postgres/Redis)
        run: npm run test:integration --workspace=api

      - name: Smoke test (boot the real server, hit it over HTTP)
        run: npm run smoke

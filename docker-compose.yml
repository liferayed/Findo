services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: findo
      POSTGRES_PASSWORD: findo
      POSTGRES_DB: findo
    ports:
      - "5432:5432"
    volumes:
      - findo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findo -d findo -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  # No host bind mount for either app service, deliberately: everything the
  # container runs — installed packages, source code, generated build output —
  # lives entirely inside the image, baked in by each Dockerfile's own COPY/RUN
  # steps. Nothing is installed, executed, or generated on the host machine,
  # and no container-internal state (node_modules included) leaks back onto
  # it. The tradeoff: a source edit isn't visible in a running container until
  # the image is rebuilt — `docker compose up --build` (what `make up`/`make
  # dev` run) is the normal way to pick up any change, not a live file-sync.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://findo:findo@postgres:5432/findo
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      OLLAMA_VISION_MODEL: qwen2.5vl:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app/api
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:3000
    working_dir: /app/web
    command: npm run dev
    depends_on:
      - api

volumes:
  findo-postgres-data:

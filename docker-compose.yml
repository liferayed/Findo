version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: findo
      POSTGRES_PASSWORD: findo
      POSTGRES_DB: findo
    ports:
      - "5432:5432"
    volumes:
      - findo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findo"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://findo:findo@postgres:5432/findo
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      OLLAMA_VISION_MODEL: qwen2.5vl:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
    working_dir: /app/api
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:3000
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    working_dir: /app/web
    command: npm run dev
    depends_on:
      - api

volumes:
  findo-postgres-data:
  api-node-modules:
  web-node-modules:

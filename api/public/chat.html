<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Findo Chat (shell)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  #log { border: 1px solid #ccc; border-radius: 8px; padding: 12px; min-height: 200px; margin-bottom: 12px; white-space: pre-wrap; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px; }
  button { padding: 8px 16px; }
</style>
</head>
<body>
  <h1>Findo Chat</h1>
  <p><em>Minimal shell — logs transactions and can't yet answer general questions.</em></p>
  <div id="log"></div>
  <form id="chat-form">
    <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" required />
    <button type="submit">Send</button>
  </form>

  <h2 style="font-size: 14px; color: #555; margin: 20px 0 6px;">Attach a receipt</h2>
  <form id="receipt-form">
    <select id="receipt-account" required></select>
    <input id="receipt-file" type="file" accept="image/jpeg,image/png" required />
    <button type="submit">Upload</button>
  </form>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const receiptForm = document.getElementById('receipt-form');
    const receiptAccountSelect = document.getElementById('receipt-account');
    const receiptFileInput = document.getElementById('receipt-file');

    function append(who, text) {
      log.textContent += `${who}: ${text}\n\n`;
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      append('You', text);
      input.value = '';

      try {
        const res = await fetch('/chat/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        const data = await res.json();
        append('Findo', res.ok ? data.reply : `Error: ${data.error}`);
      } catch (err) {
        append('Findo', `Error reaching the API: ${err.message}`);
      }
    });

    async function loadReceiptAccounts() {
      try {
        const res = await fetch('/accounts');
        if (!res.ok) return;
        const accounts = await res.json();
        receiptAccountSelect.innerHTML = '';
        accounts
          .filter((account) => account.is_active)
          .forEach((account) => {
            const option = document.createElement('option');
            option.value = account.id;
            option.textContent = account.nickname;
            receiptAccountSelect.appendChild(option);
          });
      } catch {
        // Best-effort — if this fails, the select is just empty and the user sees the
        // form-level "required" validation when they try to submit.
      }
    }
    loadReceiptAccounts();

    receiptForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = receiptFileInput.files[0];
      const accountId = receiptAccountSelect.value;
      if (!file || !accountId) return;

      append('You', `[attached receipt: ${file.name}]`);

      const formData = new FormData();
      formData.append('file', file);
      formData.append('channel', 'chat');

      // Chat has no confirm-modal UI to pause at (out of scope for the 2026-09-13 UI redesign),
      // so it calls extract then confirm back-to-back here, immediately, with whatever the
      // vision model extracted — functionally equivalent to the old single-call /documents
      // upload from the user's point of view.
      try {
        const extractRes = await fetch('/documents/extract', { method: 'POST', body: formData });
        const extractData = await extractRes.json();
        if (!extractRes.ok) {
          append('Findo', `Error: ${extractData.error || (extractData.errors && extractData.errors.join(', '))}`);
          return;
        }
        if (!extractData.is_readable) {
          append(
            'Findo',
            "I couldn't read that receipt clearly — could you reshare a clearer photo, or enter it manually?"
          );
          return;
        }

        const confirmRes = await fetch('/documents/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            file_ref: extractData.file_ref,
            original_filename: extractData.original_filename,
            channel: 'chat',
            account_id: accountId || extractData.detected_account_id,
            merchant: extractData.extraction.merchant,
            transaction_date: extractData.extraction.transaction_date,
            amount: extractData.extraction.total,
            line_items: extractData.extraction.line_items,
          }),
        });
        const confirmData = await confirmRes.json();
        append(
          'Findo',
          confirmRes.ok ? confirmData.message : `Error: ${confirmData.error || (confirmData.errors && confirmData.errors.join(', '))}`
        );
      } catch (err) {
        append('Findo', `Error reaching the API: ${err.message}`);
      }

      receiptFileInput.value = '';
    });
  </script>
</body>
</html>
